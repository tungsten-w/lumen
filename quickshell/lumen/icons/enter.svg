<?xml version="1.0" encoding="UTF-8"?>
<!--
  The Return key, drawn rather than typed: `⏎` is a font's idea of the key and
  changes shape from one font to the next, and Comfortaa has no glyph for it at
  all, so it fell back to whatever fontconfig had.

  Drawn in white on purpose. SvgIcon.qml recolors it by multiplying with the
  palette, which keeps a white source exactly, and would turn a black one black.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
     stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <path d="M20 5.5v5.5a3.5 3.5 0 0 1-3.5 3.5H6"/>
  <path d="M9.5 10.5 5.5 14.5l4 4"/>
</svg>
